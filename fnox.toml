# fnox secrets config
# secret 値は age 公開鍵で暗号化された暗号文（git コミット可）。
# 復号鍵は macOS keychain (service=fnox, account=age-key) から identity（keychain プロバイダ経由）で取得。

[providers]
keychain = { type = "keychain", service = "fnox" }
age = { type = "age", recipients = ["age1rvnrau0swu4tds583lrzgurxpv20ylvku5tgr2tg3jnqxe3gndfs0m6jp0"], identity = { provider = "keychain", value = "age-key" } }

[mcp]
# Claude(AI エージェント)に dev:preview 等で使わせるが raw 値は見せない:
# tools=exec のみ＝get_secret 不可、redact_output で出力からも伏せる。
secrets = ["AI_GATEWAY_API_KEY", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_SECRET", "GOOGLE_CLIENT_ID"]
tools = ["exec"]
redact_output = true

[secrets]
BETTER_AUTH_SECRET= { provider = "age", value = "" }
GOOGLE_CLIENT_ID= { provider = "age", value = "" }
GOOGLE_CLIENT_SECRET= { provider = "age", value = "" }
AI_GATEWAY_API_KEY= { provider = "age", value = "" }
